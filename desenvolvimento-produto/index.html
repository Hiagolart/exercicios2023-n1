<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desenvolvimento de Produto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,800&family=Barlow:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <p class="topo-sobre">Portfólio</p>
      <h1>Desenvolvimento de Produto</h1>
    </div>
  </header>

  <!-- Tela 1: portfólio -->
  <main id="tela-portfolio">
    <div class="secao-titulo">
      <h2>Lançamentos</h2>
      <p>Produtos em desenvolvimento. Clique em um para acompanhar as etapas.</p>
    </div>
    <nav class="filtros" id="filtros" aria-label="Filtrar por linha"></nav>
    <div class="grade" id="produtos"></div>
  </main>

  <!-- Tela 2: etapas de desenvolvimento do produto -->
  <main id="tela-produto" hidden>
    <button class="voltar" id="voltar">&larr; Voltar ao portfólio</button>

    <div class="produto-cabecalho">
      <div class="produto-imagem" id="produto-imagem"></div>
      <div>
        <p class="rotulo-linha">Lançamento</p>
        <h2 id="produto-nome"></h2>
        <div class="progresso">
          <div class="progresso-barra"><div id="progresso-preenchido"></div></div>
          <span id="progresso-texto"></span>
        </div>
      </div>
    </div>

    <h3>Etapas de desenvolvimento</h3>
    <p class="dica">Clique em uma etapa para ver os detalhes e alterar a situação.</p>

    <div class="fluxo-rolagem">
      <ol class="fluxo" id="fluxo" lang="pt-BR"></ol>
    </div>

    <section class="painel-etapa" id="painel-etapa" hidden></section>

    <ul class="legenda">
      <li><span class="amostra concluida"></span>Concluída</li>
      <li><span class="amostra andamento"></span>Em andamento</li>
      <li><span class="amostra pendente"></span>Pendente</li>
    </ul>

    <button class="restaurar" id="restaurar"><b aria-hidden="true">&#x21bb;</b> Restaurar situação padrão</button>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
