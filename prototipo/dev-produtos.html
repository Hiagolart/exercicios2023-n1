<title>Dev Produtos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --amarelo:#F2B705; --amarelo-ink:#1d1a10; --amarelo-soft:#FDF3D0;
  --nav:#1E2124; --nav-2:#2A2E33; --nav-ink:#D9DCE0; --nav-muted:#8C939B;
  --bg:#F2F3F1; --card:#FFFFFF; --ink:#1B1E22; --muted:#646A72; --line:#E1E3DF; --line-2:#ECEDEA;
  --verde:#1E7F4A; --verde-bg:#E3F3E9;
  --azul:#2359B8; --azul-bg:#E4ECFA;
  --amar:#8A6200; --amar-bg:#FCF1CF;
  --roxo:#6B43B8; --roxo-bg:#EEE7FA;
  --cinza:#666C74; --cinza-bg:#ECEDEE;
  --verm:#B8322A; --verm-bg:#FBE6E4;
  --sim-bg:#FFF9E6;
  --shadow:0 1px 2px rgba(20,22,25,.06),0 1px 1px rgba(20,22,25,.04);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --amarelo-ink:#1d1a10; --amarelo-soft:#3a3014;
    --nav:#111315; --nav-2:#1d2024; --nav-ink:#D9DCE0; --nav-muted:#7d848c;
    --bg:#17191C; --card:#212428; --ink:#E8EAEC; --muted:#9BA2AA; --line:#33373C; --line-2:#2b2f33;
    --verde:#5BC98A; --verde-bg:#1d3326; --azul:#7FA8F0; --azul-bg:#1c2a42;
    --amar:#E8BE4C; --amar-bg:#3a3014; --roxo:#B399EC; --roxo-bg:#2c2440;
    --cinza:#A4AAB1; --cinza-bg:#2c3035; --verm:#F08A80; --verm-bg:#3d2220; --sim-bg:#2d2915;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --amarelo-ink:#1d1a10; --amarelo-soft:#3a3014;
  --nav:#111315; --nav-2:#1d2024; --nav-ink:#D9DCE0; --nav-muted:#7d848c;
  --bg:#17191C; --card:#212428; --ink:#E8EAEC; --muted:#9BA2AA; --line:#33373C; --line-2:#2b2f33;
  --verde:#5BC98A; --verde-bg:#1d3326; --azul:#7FA8F0; --azul-bg:#1c2a42;
  --amar:#E8BE4C; --amar-bg:#3a3014; --roxo:#B399EC; --roxo-bg:#2c2440;
  --cinza:#A4AAB1; --cinza-bg:#2c3035; --verm:#F08A80; --verm-bg:#3d2220; --sim-bg:#2d2915;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.app{display:flex;min-height:100%}
/* sidebar */
.side{width:232px;flex:none;background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid var(--nav-2)}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--amarelo);color:var(--amarelo-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px}
.brand-name{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.02em;line-height:1}
.brand-sub{font-size:11px;color:var(--nav-muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav-group{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--nav-muted);padding:14px 12px 6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:var(--nav-ink);font-size:13.5px}
.nav button:hover{background:var(--nav-2)}
.nav button:focus-visible{outline:2px solid var(--amarelo);outline-offset:-2px}
.nav button.on{background:var(--nav-2);color:#fff;box-shadow:inset 3px 0 0 var(--amarelo)}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.side-foot{padding:14px 18px;font-size:11.5px;color:var(--nav-muted);border-top:1px solid var(--nav-2)}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none}
.proto{background:var(--amarelo-soft);color:var(--ink);font-size:12.5px;padding:7px 24px;border-bottom:1px solid var(--line)}
.proto b{font-weight:600}
.page{padding-block:22px 40px;padding-inline:24px;display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.05;margin:0;letter-spacing:.005em;text-wrap:balance}
.ph .sub{color:var(--muted);margin-top:4px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 12px;font-weight:500;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--amarelo);outline-offset:1px}
.btn.pri{background:var(--amarelo);border-color:var(--amarelo);color:var(--amarelo-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0;font-size:14px;font-weight:600}
.card-b{padding:14px 16px}
.hint{color:var(--muted);font-size:12.5px}
/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 8px;font-size:13px;max-width:100%}
.filters label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:3px}
.chip-clear{border:none;background:none;color:var(--azul);cursor:pointer;font-size:12.5px;align-self:flex-end;padding:6px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px 11px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);position:relative}
.kpi:hover{border-color:var(--muted)}
.kpi:focus-visible{outline:2px solid var(--amarelo)}
.kpi.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.kpi .n{font-family:var(--display);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted);line-height:1.25}
.kpi .dot{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%}
.kpi.alert .n{color:var(--verm)}
/* status */
.st{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.5}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-verde{color:var(--verde);background:var(--verde-bg)} .c-azul{color:var(--azul);background:var(--azul-bg)}
.c-amar{color:var(--amar);background:var(--amar-bg)} .c-roxo{color:var(--roxo);background:var(--roxo-bg)}
.c-cinza{color:var(--cinza);background:var(--cinza-bg)} .c-verm{color:var(--verm);background:var(--verm-bg)}
.bg-verde{background:var(--verde)} .bg-azul{background:var(--azul)} .bg-amar{background:var(--amar)} .bg-roxo{background:var(--roxo)} .bg-cinza{background:var(--cinza)} .bg-verm{background:var(--verm)}
/* funil */
.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.phase{all:unset;cursor:pointer;padding:14px 16px;border-right:1px solid var(--line-2);position:relative;display:flex;flex-direction:column;gap:4px}
.phase:last-child{border-right:none}
.phase:hover{background:var(--line-2)}
.phase:focus-visible{outline:2px solid var(--amarelo);outline-offset:-2px}
.phase.sel{background:var(--amarelo-soft)}
.phase .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.phase .t{font-weight:600;font-size:13.5px;line-height:1.25;min-height:2.5em}
.phase .n{font-family:var(--display);font-size:30px;font-weight:600;line-height:1}
.phase .steps{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
/* tabelas */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--line-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pname{font-weight:600}
.late{color:var(--verm);font-weight:600;font-variant-numeric:tabular-nums}
.ni{color:var(--muted);font-style:italic}
.bar{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;min-width:70px;display:flex}
.bar i{display:block;height:100%}
.pct{display:flex;align-items:center;gap:8px}
.pct span{font-variant-numeric:tabular-nums;font-size:12px;width:34px;text-align:right}
.segbar{display:grid;grid-template-columns:7fr 5fr 5fr 3fr 1fr;gap:3px;min-width:180px}
.segbar div{height:8px;border-radius:2px;background:var(--line-2);overflow:hidden}
.segbar div i{display:block;height:100%;background:var(--ink)}
/* projeto */
.phead{display:grid;grid-template-columns:1fr auto;gap:16px;padding:16px}
.phead h1{font-family:var(--display);font-size:28px;font-weight:600;margin:2px 0 6px;line-height:1.05;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.big-pct{text-align:right}
.big-pct .n{font-family:var(--display);font-size:40px;font-weight:600;line-height:1}
.back{all:unset;cursor:pointer;color:var(--muted);font-size:12.5px}
.back:hover{color:var(--ink)}
.timeline{display:grid;grid-template-columns:7fr 5fr 5fr 3fr 1.3fr;gap:10px;padding:0 16px 16px}
.tl-phase .k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-steps{display:flex;gap:3px}
.tl-step{border:0;margin:0;padding:0;appearance:none;cursor:pointer;flex:1;height:30px;border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-size:11.5px;font-weight:500;min-width:22px}
.tl-step:focus-visible{outline:2px solid var(--amarelo);outline-offset:1px}
.tl-step.sel{outline:2px solid var(--ink);outline-offset:1px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px}
.tab{all:unset;cursor:pointer;padding:11px 12px;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--amarelo);font-weight:600}
.tab:focus-visible{outline:2px solid var(--amarelo);outline-offset:-2px}
.tab.ghost{opacity:.55}
.tabs-tools{display:flex;justify-content:flex-end;padding:8px 16px 0}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:7px 16px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.gate{border-left:3px solid var(--amar);background:var(--amar-bg);padding:10px 12px;border-radius:0 6px 6px 0;font-size:13px}
.gate.red{border-color:var(--verm);background:var(--verm-bg)}
.gate.ok{border-color:var(--verde);background:var(--verde-bg)}
.gate ul{margin:6px 0 0;padding-left:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:12.5px}
.seg button.on{background:var(--ink);color:var(--card)}
.seg button:focus-visible{outline:2px solid var(--amarelo);outline-offset:-2px}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.cur{font-size:11px;color:var(--muted);font-family:var(--mono);margin-right:3px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.stat .l{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.stat.usd{border-top:3px solid var(--azul)} .stat.brl{border-top:3px solid var(--verde)} .stat.fz{border-top:3px solid var(--amarelo)}
.range{position:relative;height:56px;margin:12px 8px 4px}
.range .track{position:absolute;left:0;right:0;top:22px;height:10px;background:linear-gradient(90deg,var(--verde-bg),var(--azul-bg),var(--verm-bg));border-radius:5px;border:1px solid var(--line)}
.range .tick{position:absolute;top:14px;width:2px;height:26px;background:var(--muted)}
.range .tl{position:absolute;top:42px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.range .fz{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.range .fz b{font-size:11px;background:var(--amarelo);color:var(--amarelo-ink);padding:1px 6px;border-radius:3px;white-space:nowrap}
.range .fz i{width:3px;height:30px;background:var(--amarelo);border:1px solid var(--amarelo-ink)}
.sim{background:var(--sim-bg);border:1px dashed var(--amar);border-radius:8px}
.sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.sim-grid label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sim-grid input{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:7px 9px;font-size:14px;font-variant-numeric:tabular-nums;width:100%}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.hist .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hist .who{font-size:12px;color:var(--muted)}
.diff{font-family:var(--mono);font-size:12px}
.diff s{color:var(--verm)} .diff ins{color:var(--verde);text-decoration:none}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.drawer-bg{display:none}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:30;transform:translateX(-100%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .app.open .side{transform:none}
  .app.open .drawer-bg{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
  .topbar{display:flex;align-items:center;gap:12px;background:var(--nav);color:#fff;padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
  .topbar button{all:unset;cursor:pointer;display:grid;place-items:center;width:32px;height:32px}
  .topbar svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
  .page{padding-inline:16px}
  .proto{padding-inline:16px}
  .phases{grid-template-columns:1fr 1fr}
  .phase{border-bottom:1px solid var(--line-2)}
  .phead{grid-template-columns:1fr}
  .big-pct{text-align:left}
  .timeline{grid-template-columns:1fr}
  .hist li{grid-template-columns:1fr;gap:2px}
  table.cards thead{display:none}
  table.cards tr{display:block;border-bottom:1px solid var(--line);padding:10px 12px}
  table.cards td{display:flex;justify-content:space-between;gap:12px;border:none;padding:3px 0;text-align:right}
  table.cards td::before{content:attr(data-l);color:var(--muted);font-size:12px;text-align:left}
  table.cards td.first{display:block;text-align:left}
  table.cards td.first::before{content:none}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

<div class="app" id="app">
  <div class="drawer-bg" id="drawerBg"></div>

</div>

  p.etapas = ETAPAS.map(e=>{
    let st = e.n<p.atual?"Concluído":(e.n===p.atual?p.stAtual:"Não iniciado");
    if(p.extra && p.extra[e.n]) st=p.extra[e.n];
    return {n:e.n,status:st};
  });
  // datas previstas relativas à etapa atual
  const ref = Math.min(p.atual,21);
  let acc=0; const cum=[0];
  ETAPAS.forEach(e=>{acc+=e.dur;cum.push(acc)});
  p.etapas.forEach(et=>{
    et.prev = addDays(p.prevAtual,(cum[et.n]-cum[ref]));
    et.real = et.status==="Concluído"? addDays(et.prev, (et.n*7)%5-2):null;
  });
  const concl = p.etapas.filter(e=>e.status==="Concluído").length;
  p.pct = Math.round(concl/21*100);
  const cur = p.etapas.find(e=>e.status!=="Concluído");
  p.etapaAtual = cur? cur.n : 21;
  p.fase = ETAPAS[p.etapaAtual-1].fase;
  p.lancado = p.etapas[19].status==="Concluído";
  p.bloq = p.etapas.some(e=>e.status==="Bloqueado");

  p.statusExib = cur? cur.status : "Concluído";
  p.prevExib = cur? cur.prev : p.etapas[20].prev;
});

function estagio(p){
  const a=p.etapaAtual;
  if(p.lancado) return "lancados";
  if(a<=3) return "pesquisa";
  if(a<=5) return "cotacao";
  if(a<=7) return "viabilidade";
  if(a<=9) return "auditoria";
  if(a===10) return "producao";
  if(a===11) return "validacao";
  if(a===13 && p.etapas[12].status==="Não iniciado") return "homologados";
  return "preparacao";
}

   <label class="toggle" style="flex-direction:row;text-transform:none;letter-spacing:0;font-size:13px;align-self:flex-end;padding:6px 0"><input type="checkbox" data-pr="parcial" ${state.inclParcial?"checked":""}> Incluir parcialmente equivalentes</label>
   <label class="toggle" style="flex-direction:row;text-transform:none;letter-spacing:0;font-size:13px;align-self:flex-end;padding:6px 0"><input type="checkbox" data-pr="desat" ${state.inclDesat?"checked":""}> Incluir preços com mais de ${DIAS_DESATUALIZADO} dias</label>
   <span class="hint" style="align-self:flex-end;padding:6px 0">Base: preços com impostos</span></div>`;
  if(!vals.length) return toggles+`<div class="empty">Nenhum preço atende aos filtros.</div>`;
  const mn=Math.min(...vals),mx=Math.max(...vals),avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const diff=(PRECO_FZ-avg)/avg*100; const pos=mx>mn?(PRECO_FZ-mn)/(mx-mn)*100:50;
  const posTxt = pos<0?"Abaixo da faixa":pos<=33?"Faixa inferior":pos<=66?"Faixa média":pos<=100?"Faixa superior":"Acima da faixa";
  const minM=set.find(m=>m.preco===mn), maxM=set.find(m=>m.preco===mx);
  const clamp=v=>Math.max(0,Math.min(100,v));
  return toggles+`
  ${vals.length<3?`<div class="gate" style="margin-bottom:12px">Amostra de mercado insuficiente: só ${vals.length} preço(s).</div>`:""}
  <div class="split">
   <div class="stat"><div class="l">Menor preço</div><div class="v">${brl(mn)}</div><div class="s">${minM.emp} · ${fmtD(rel(-minM.dias))}</div></div>
   <div class="stat"><div class="l">Média de mercado</div><div class="v">${brl(avg)}</div><div class="s">n = ${vals.length} preço(s)</div></div>
   <div class="stat"><div class="l">Maior preço</div><div class="v">${brl(mx)}</div><div class="s">${maxM.emp} · ${fmtD(rel(-maxM.dias))}</div></div>
   <div class="stat fz"><div class="l">Preço projetado (nosso)</div><div class="v">${brl(PRECO_FZ)}</div><div class="s"><b style="color:var(--${diff>0?"amar":"verde"})">${diff>0?"+":""}${nf2.format(diff)}%</b> vs. média · ${posTxt}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="card-h"><h3>Posicionamento na faixa de mercado</h3><span class="hint">${posTxt}</span></div><div class="card-b">
   <div class="range"><div class="track"></div>
    <div class="tick" style="left:0"></div><div class="tl" style="left:0;transform:none">${brl(mn)}</div>
    <div class="tick" style="left:${(avg-mn)/(mx-mn||1)*100}%"></div><div class="tl" style="left:${(avg-mn)/(mx-mn||1)*100}%">média</div>
    <div class="tick" style="right:0;left:auto"></div><div class="tl" style="right:0;left:auto;transform:none">${brl(mx)}</div>
    <div class="fz" style="left:${clamp(pos)}%"><b>Nosso preço</b><i></i></div>
   </div></div></div>
  <div class="tw" style="margin-top:14px"><table><thead><tr><th>Considerados</th><th>Equivalência</th><th class="num">Preço</th><th>Data</th><th>Fonte</th><th>Acessórios inclusos</th><th>Garantia</th></tr></thead><tbody>
  ${set.map(m=>`<tr><td>${m.emp} · ${m.modelo}</td><td>${badge(m.eq==="Parcialmente equivalente"?"Parcial":m.eq,EQ[m.eq])}</td><td class="num">${brl(m.preco)}</td><td>${fmtD(rel(-m.dias))}</td><td>${m.fonte}</td><td>${m.ac}</td><td>${m.gar}</td></tr>`).join("")}</tbody></table></div>`;
}
function calcNac(v){
  const freteUn=v.freteCont/v.qtd, seguroUn=v.fob*v.seguroPct/100;
  const base=(v.fob+freteUn+seguroUn)*v.cambio;
  const trib=base*v.tribPct/100;
  const port=v.portCont/v.qtd, imp=v.impCont/v.qtd, tr=v.transpCont/v.qtd;
  const total=base+trib+port+imp+tr+v.outrosUn;
  return {freteUn,seguroUn,base,trib,port,imp,tr,outros:v.outrosUn,total};
}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-go],[data-kpi],[data-fase],[data-open],[data-tab],[data-step],[data-comp],[data-act],[data-loadsim]");
  if(!t) return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.kpi){ state.kpi = state.kpi===t.dataset.kpi?"":t.dataset.kpi; render(); return; }
  if(t.dataset.fase){ state.filters.fase = state.filters.fase===t.dataset.fase?"":t.dataset.fase; render(); return; }
  if(t.dataset.open){ state.projeto=t.dataset.open; state.view="projeto"; state.step=null; state.tab=(PROJ.find(p=>p.id===t.dataset.open).demo&&state.lastTab)||"geral"; render(); window.scrollTo(0,0); return; }
  if(t.dataset.tab){ state.tab=t.dataset.tab; try{localStorage.setItem("dp_tab",state.tab);state.lastTab=state.tab;}catch(e){} render(); return; }
  if(t.dataset.step){ const n=+t.dataset.step; state.step = state.step===n?null:n; render(); return; }
  if(t.dataset.comp){ state.compMode=t.dataset.comp; render(); return; }
  if(t.dataset.loadsim){ const c=CENARIOS[+t.dataset.loadsim]; SIM=Object.assign({},c.v); render(); return; }
  const a=t.dataset.act;
  if(a==="clear"){ state.filters={cat:"",resp:"",forn:"",st:"",fase:"",q:""}; state.kpi=""; render(); }
  if(a==="closestep"){ state.step=null; render(); }
  if(a==="novo"){ go("novo"); }
  if(a==="resetsim"){ SIM=Object.assign({},NAC,{margem:30,preco:PRECO_FZ}); render(); }
  if(a==="savesim"){ const r=calcNac(SIM); CENARIOS.push({nome:"Cenário "+(CENARIOS.length+1),desc:"câmbio "+nf2.format(SIM.cambio)+" · "+SIM.qtd+"/contêiner",v:Object.assign({},SIM)}); render(); }
});

  if(t.dataset.f!==undefined && t.tagName==="SELECT"){ state.filters[t.dataset.f]=t.value; render(); }
  if(t.id==="allTabs"){ state.allTabs=t.checked; render(); }
  if(t.dataset.pr){ if(t.dataset.pr==="tipo")state.tipoPreco=t.value; if(t.dataset.pr==="parcial")state.inclParcial=t.checked; if(t.dataset.pr==="desat")state.inclDesat=t.checked; render(); }
  if(t.dataset.sim){ const v=parseFloat(t.value); if(!isNaN(v)&&(t.dataset.sim!=="qtd"||v>=1)){ SIM[t.dataset.sim]=v; const id=t.id; render(); const n=document.getElementById(id); if(n) n.focus(); } }
});
let qTimer;
document.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.id==="f_q"){ clearTimeout(qTimer); qTimer=setTimeout(()=>{ state.filters.q=t.value; render(); const n=document.getElementById("f_q"); if(n){n.focus(); n.setSelectionRange(n.value.length,n.value.length);} },250); }
});
document.addEventListener("submit",ev=>{
  if(ev.target.id==="novoForm"){ ev.preventDefault(); const m=document.getElementById("novoMsg"); m.textContent="No protótipo o projeto não é gravado. No sistema real, ele recebe o código PRJ-AAAA-NNN e as 21 etapas."; }
});
document.getElementById("menuBtn").addEventListener("click",()=>document.getElementById("app").classList.add("open"));
document.getElementById("drawerBg").addEventListener("click",closeDrawer);

render();
})();
</script>
